name: File watch diagnostics

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full editor session to reproduce interactions between specs.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: file-watch-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_FILE_WATCH_TRACE: "1"
      FULL_SUITE: ${{ inputs.full_suite }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use HTTPS for git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci
      - name: Download Electron
        run: node node_modules/electron/install.js
      - name: Build native modules for Electron
        run: npm run build
      - name: Trace the application-owned file worker
        shell: bash
        run: |
          set -o pipefail
          if [ "$FULL_SUITE" = "true" ]; then
            npm run test:editor 2>&1 | tee file-watch-trace.log
          else
            npm run test:only -- spec/file-watch-integration-spec.js spec/watch-file-spec.js spec/text-buffer-file-watch-spec.js spec/text-buffer-io-spec.js 2>&1 | tee file-watch-trace.log
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: file-watch-trace
          path: file-watch-trace.log
          retention-days: 7
