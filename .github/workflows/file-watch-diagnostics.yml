name: File watch diagnostics

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full editor session to reproduce interactions between specs.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: file-watch-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: File watch diagnostics on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_FILE_WATCH_TRACE: "1"
      FULL_SUITE: ${{ inputs.full_suite }}
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev fonts-noto-cjk
      - name: Use HTTPS for git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        shell: bash
        run: |
          install() { npm ci; }
          install || install || install
      - name: Download Electron
        run: node script/install-electron.js
      - name: Build native modules for Electron
        run: npm run build
      - name: Trace the application-owned file worker
        shell: bash
        run: |
          set -o pipefail
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          if [ "$FULL_SUITE" = "true" ]; then
            $prefix npm run test:editor 2>&1 | tee file-watch-trace.log
          else
            $prefix npm run test:only -- spec/file-watch-runtime-spec.js spec/file-watch-performance-spec.js spec/file-watch-client-spec.js spec/config-file-spec.js spec/file-watch-integration-spec.js spec/file-watch-repository-lifecycle-spec.js spec/watch-file-spec.js spec/text-buffer-file-watch-spec.js spec/text-buffer-io-spec.js spec/project-repository-discovery-spec.js spec/repository-registry-spec.js spec/repository-routing-performance-spec.js spec/repository-lifecycle-spec.js spec/repository-file-watch-integration-spec.js spec/git-repository-provider-spec.js spec/git-repository-descriptor-spec.js spec/git-repository-provider-lifecycle-spec.js spec/git-repository-discovery-renderer-spec.js spec/git-repository-spec.js spec/git-repository-host-facade-spec.js spec/git-host-real-process-spec.js spec/git-repository-lifecycle-host-spec.js 2>&1 | tee file-watch-trace.log
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: file-watch-trace-${{ matrix.os }}
          path: file-watch-trace.log
          retention-days: 7
