name: Validate WASM Grammar Changes

# Any change to a committed grammar `.wasm` binary must be accompanied by an
# update to the `parserSource` key in the corresponding `grammar.json`, so the
# binary's provenance stays traceable. Adapted from the upstream Pulsar check.

on:
  pull_request:
    paths:
      - "**.wasm"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The validation script compares against earlier commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # npm records the @lumine-code git forks with ssh URLs, but the runner has
      # no ssh key. Rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run validation script
        run: node ./script/validate-wasm-grammar-prs.js
