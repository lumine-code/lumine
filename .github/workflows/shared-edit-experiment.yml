name: Shared edit experiment

on:
  push:
    paths:
      - benchmark/experiments/shared-edit-superstring.patch
      - .github/workflows/shared-edit-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Experimental native ownership on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
      GYP_DEFINES: "mac_deployment_target=13.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/superstring
          ref: 14f39ee40d749f37d2b554f026e974fa43d07f98
          path: native-experiment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply the archived prototype
        working-directory: native-experiment
        run: git apply ../benchmark/experiments/shared-edit-superstring.patch
      - name: Build the experimental addon
        working-directory: native-experiment
        run: npm ci
      - name: Test Node behavior and ownership
        working-directory: native-experiment
        run: node --expose-gc node_modules/jasmine/bin/jasmine.js
      - name: Test native algorithms and shared block lifetimes
        working-directory: native-experiment
        run: npm run test:native
      - name: Validate packaging
        working-directory: native-experiment
        run: npm pack --dry-run
