name: CI

on:
  # No `paths-ignore`: the lint lane covers markdown too, and a docs-only push
  # is cheap to run. Use [skip ci] in the head commit message for a genuinely
  # inert change.
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Print one line per spec instead of dots; CI logs stay readable and a hang
  # points at the exact spec.
  LUMINE_JASMINE_REPORTER: list

# Tests run by default (no commit marker needed). The fast lint/format lane
# runs on every push and pull request; the expensive 3-OS matrix runs on pushes
# to `master`, on pull requests, on manual dispatch, and on reusable calls.
# Skip a run with `[skip ci]` in the head commit message. Distributable binaries
# are cut by `release.yml` on a `vX.Y.Z` tag, not here.

jobs:
  lint:
    # Gating: the eslint and formatting debt has been cleared, so these steps
    # fail the run on any new lint error, warning, or formatting drift.
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm records the @lumine-code git forks with ssh URLs, but the runner has
      # no ssh key. Rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # Linting needs the dev dependencies but no native builds, so skip install
      # scripts (Electron download, node-gyp) for a fast job.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      # Themes must not re-declare icon box geometry — the icon contract in
      # static/atom-ui/styles/icons.css is its single owner.
      - name: Check icon contract
        run: npm run check:icons
      # A theme that reaches an editor through atom-panel-container styles it by
      # where its panel docked, not by what it is. Nothing at runtime notices.
      - name: Check editor contract
        run: npm run check:editors
      # A capture left with its Neovim name compiles and matches, so the query
      # sweep in the spec suite passes while the scope themes as nothing. This
      # is the only gate that sees it.
      - name: Check grammar captures
        run: npm run check:grammar-captures
      # A lockfile entry for a bundled package records the dependency list of
      # the commit it was written for, and npm re-reads a git dependency only
      # when the entry disagrees with the manifest — so an entry naming one
      # commit while describing another installs the wrong tree and reports
      # success. This runs against the tree `npm ci` just built.
      - name: Check bundled dependencies
        run: npm run check:bundled-deps
      # The application menu normalizes nothing — merge only appends, unmerge
      # never removes a separator, and the template goes straight to Electron —
      # so a menu file's shape is exactly what the user sees. Nothing at runtime
      # reports a package that gets it wrong; a bundled package's context-menu
      # selectors are not even validated (Package#activateMenus skips that for
      # bundled packages).
      - name: Check menu conventions
        run: npm run check:menus

      # Keybindings, same idea. The one that pays for the rest is the
      # chord-prefix check: a keystroke that is both a complete binding and the
      # prefix of a longer one stalls for a full second before it fires, and
      # nothing else reports it.
      - name: Check keybinding conventions
        run: npm run check:keymaps

  test:
    name: Test on ${{ matrix.os }}
    # The fast lane (lint) runs everywhere; the full matrix is reserved for
    # pushes to master, pull requests, manual dispatch, and reusable calls.
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    # Native rebuild plus the full editor and package suites are slow, so give
    # the job a generous ceiling; the individual spec steps have their own
    # tighter timeouts. Spec steps run once and are never retried.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The editor requires Node >= 24.18 (see .nvmrc / package.json engines),
        # which the whole fleet now targets, so the matrix varies only by OS.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        # fonts-noto-cjk backs the editor's double-width/half-width/Korean
        # character measurements in the text-editor-component specs.
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev fonts-noto-cjk
      # Most native install scripts are wasted here: those modules are rebuilt
      # for Electron below regardless. They stay skipped because npm's
      # allow-scripts gate blocks anything absent from `allowScripts` in
      # package.json -- so a plain `npm ci` runs only what is approved there,
      # which today is node-pty. That one is not optional: it is a TypeScript
      # package whose `prepare` emits `lib/`, and nothing later reproduces it,
      # so `--ignore-scripts` would install it without an entry point.
      #
      # npm records the @lumine-code git forks with ssh URLs, but the runners
      # have no ssh key. Rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # Preparing the many git-hosted `@lumine-code` forks can be flaky on
      # Windows (intermittent network or pack failures while cloning a git
      # dependency). Retry a couple of times to absorb it.
      - name: Install dependencies
        shell: bash
        run: |
          install() { npm ci; }
          install || install || install
      - name: Download the Electron binary
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        run: npm run build
      # A single full-suite Electron session, capped so a wedged session cannot
      # hang the job. No retries and no per-file fallback: a failure here is a
      # real regression or a flaky spec, and flaky specs get fixed rather than
      # absorbed into a 30-minute isolation pass.
      - name: Run editor specs
        shell: bash
        timeout-minutes: 60
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          # macOS runners have no GNU `timeout`; Homebrew coreutils ships it as
          # `gtimeout`. Without either, the step timeout is the backstop.
          if command -v timeout >/dev/null 2>&1; then guard="timeout 2700"
          elif command -v gtimeout >/dev/null 2>&1; then guard="gtimeout 2700"
          else guard=""; fi
          $guard $prefix npm run test:editor
      # The main-process (Electron main) suite runs under Mocha in a single
      # short session (a few seconds). Like the editor specs it runs once with a
      # timeout guard; a failure here is a real regression, not a retry target.
      - name: Run main-process specs
        shell: bash
        timeout-minutes: 15
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          if command -v timeout >/dev/null 2>&1; then guard="timeout 600"
          elif command -v gtimeout >/dev/null 2>&1; then guard="gtimeout 600"
          else guard=""; fi
          $guard $prefix npm run test:main
      # Run each bundled package in its own Electron session. The combined
      # `npm run test:pkgs` session suffers cross-package state leakage (~200
      # spurious failures) and has hung CI runners; per-package isolation
      # matches how the packages are developed and verified. The `timeout`
      # guard turns any hung package into a fast failure with logs intact.
      - name: Run bundled package specs
        shell: bash
        timeout-minutes: 90
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          # macOS runners have no GNU `timeout`; Homebrew coreutils ships it
          # as `gtimeout`. Without either, the step timeout is the backstop.
          if command -v timeout >/dev/null 2>&1; then
            guard="timeout 600"
          elif command -v gtimeout >/dev/null 2>&1; then
            guard="gtimeout 600"
          else
            guard=""
          fi
          status=0
          failed=""
          # The bundled set is defined by src/bundled-packages.js: every
          # dependency whose own manifest declares an engines.lumine range,
          # resolved wherever the copy lives. Both delivery forms ship with
          # the editor, so both are covered here — otherwise moving a package
          # out of the tree would silently stop running its specs against
          # core changes.
          dirs=$(node -e '
            const fs = require("fs"), path = require("path");
            const { scanBundledPackageNames, resolveBundledPackageDir } = require("./src/bundled-packages");
            const out = [];
            for (const name of scanBundledPackageNames(".")) {
              const dir = resolveBundledPackageDir(".", name);
              if (dir && fs.existsSync(path.join(dir, "spec"))) out.push(path.join(dir, "spec"));
            }
            console.log(out.join("\n"));
          ')
          for d in $dirs; do
            pkg="${d#packages/}"
            pkg="${pkg#node_modules/}"
            pkg="${pkg%/spec}"
            echo "::group::$pkg"
            # Run once. A failure here is a real regression or a flaky spec;
            # flaky specs get fixed at the source rather than retried away.
            if ! $guard $prefix npm start -- --test "$d"; then
              echo "::error::Package specs failed: $pkg"
              failed="$failed $pkg"
              status=1
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Failed packages:$failed"; fi
          exit $status
      # The crash reporter (enabled by default on Windows/Linux, see
      # src/main-process/start.js) writes renderer minidumps to
      # ~/.lumine/crashdumps even when a later attempt turns the job green.
      # Surface them so native crashes can be analyzed offline.
      - name: Stage crash dumps
        if: always()
        shell: bash
        run: |
          dumpdir="$HOME/.lumine/crashdumps"
          if [ -d "$dumpdir" ] && find "$dumpdir" -name '*.dmp' | grep -q .; then
            mkdir -p crashdumps-artifact
            cp -r "$dumpdir"/. crashdumps-artifact/
            echo "Found crash dumps:"
            find crashdumps-artifact -name '*.dmp'
          else
            echo "No crash dumps found."
          fi
      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crashdumps-${{ matrix.os }}
          path: crashdumps-artifact/
          if-no-files-found: ignore
          retention-days: 7
