name: CI

on:
  # No `paths-ignore`: the lint lane covers markdown too, and a docs-only push
  # is cheap to run. Use [skip ci] in the head commit message for a genuinely
  # inert change.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit or ref to test (defaults to the triggering commit)
        type: string
        required: false
        default: ""
      macos_runner:
        description: macOS runner for this manual validation
        type: choice
        required: true
        default: macos-latest
        options:
          - macos-latest
          - macos-15-intel
      platform:
        description: Operating systems to test
        type: choice
        required: true
        default: all
        options:
          - all
          - macos
  workflow_call:
    inputs:
      source_ref:
        description: Source commit or ref to test (defaults to the triggering commit)
        type: string
        required: false
        default: ""
      macos_runner:
        description: macOS hosted runner (macos-latest or macos-15-intel)
        type: string
        required: false
        default: macos-latest
      platform:
        description: Operating systems to test (all or macos)
        type: string
        required: false
        default: all

permissions:
  contents: read

concurrency:
  # Normal pushes and pull requests keep their existing concurrency group.
  # Selected source/platform/runner combinations validate independently.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{
      inputs.platform && format('{0}-{1}-{2}', inputs.source_ref || github.sha,
        inputs.platform == 'macos' && 'macos' || 'all',
        inputs.macos_runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-latest'
      ) || ''
    }}
  cancel-in-progress: true

env:
  # Print one line per spec instead of dots; CI logs stay readable and a hang
  # points at the exact spec.
  LUMINE_JASMINE_REPORTER: list

# Tests run by default (no commit marker needed). The fast lint/format lane
# runs on every push and pull request; the expensive 3-OS matrix runs on pushes
# to `master`, on pull requests, on manual dispatch, and on reusable calls.
# Skip a run with `[skip ci]` in the head commit message. Distributable binaries
# are cut by `release.yml` on a `vX.Y.Z` tag, not here.

jobs:
  lint:
    # Gating: the eslint and formatting debt has been cleared, so these steps
    # fail the run on any new lint error, warning, or formatting drift.
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm records the @lumine-code git forks with ssh URLs, but the runner has
      # no ssh key. Rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # Linting needs the dev dependencies but no native builds, so skip install
      # scripts (Electron download, node-gyp) for a fast job.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check API documentation
        run: npm run check:api-docs
      - name: Check generated theme defaults
        run: npm run check:theme-variables
      # Timings are reported for review, while deterministic syscall and lookup
      # counts gate the known-file, warm-cache and repository-invalidation paths.
      - name: Benchmark icon resolution
        run: npm run benchmark:icons
      - name: Test API extractor
        run: npm run test:api-extractor
      - name: Test JSX lint rules
        run: npm run test:eslint-jsx
      - name: Test package storage concurrency
        run: npm run test:storage
      - name: Test Electron download retries
        run: node --test script/install-electron.test.js
      - name: Test headless dependency preparation
        run: node --test script/install-headless-dependencies.test.js
      - name: Test application packaging
        run: node --test script/check-built-app.test.js script/generate-metadata-for-builder.test.js
      - name: Test demo capture validation
        run: node --test script/demo.test.js
      - name: Audit production dependencies
        run: |
          node --test script/check-audit.test.js
          npm audit --omit=dev --audit-level=none --json > "$RUNNER_TEMP/npm-audit.json"
          node script/check-audit.js "$RUNNER_TEMP/npm-audit.json"
      # Themes must not re-declare icon box geometry — the icon contract in
      # static/lumine-ui/styles/icons.css is its single owner.
      - name: Check icon contract
        run: npm run check:icons
      # A theme that reaches an editor through lumine-panel-container styles it by
      # where its panel docked, not by what it is. Nothing at runtime notices.
      - name: Check editor contract
        run: npm run check:editors
      # A capture left with its Neovim name compiles and matches, so the query
      # sweep in the spec suite passes while the scope themes as nothing. This
      # is the only gate that sees it.
      - name: Check grammar captures
        run: npm run check:grammar-captures
      # A lockfile entry for a bundled package records the dependency list of
      # the commit it was written for, and npm re-reads a git dependency only
      # when the entry disagrees with the manifest — so an entry naming one
      # commit while describing another installs the wrong tree and reports
      # success. This runs against the tree `npm ci` just built.
      - name: Check bundled dependencies
        run: npm run check:bundled-deps
      # A command's palette label is derived from its name by the acronym
      # vocabulary in underscore-plus, so a displayName is only ever an escape
      # hatch. This catches the three ways one goes wrong — renaming the
      # command in the label, repeating what the humanizer already says, or
      # re-casing a word the palette does not honour.
      - name: Check command display names
        run: npm run check:commands

  test:
    name: Test on ${{ matrix.os }}
    # The fast lane (lint) runs everywhere; the full matrix is reserved for
    # pushes to master, pull requests, manual dispatch, and reusable calls.
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    # Native rebuild plus the full editor and package suites are slow, so give
    # the job a generous ceiling; the individual spec steps have their own
    # tighter timeouts. Spec steps run once and are never retried.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The editor requires Node >= 24.18 (see .nvmrc / package.json engines),
        # which the whole fleet now targets, so the matrix varies only by OS.
        # Only explicit manual/reusable inputs select one OS or the Intel backup.
        # Every runner label comes from these literals, never unchecked input.
        os: >-
          ${{ fromJSON(
            inputs.platform == 'macos' &&
            (inputs.macos_runner == 'macos-15-intel' && '["macos-15-intel"]' || '["macos-latest"]') ||
            (inputs.macos_runner == 'macos-15-intel' && '["ubuntu-latest","macos-15-intel","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]')
          ) }}
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        # Preserve native-build headers and the fonts used by renderer specs.
        # Authenticate and download fully before starting the cached install.
        run: node script/install-headless-dependencies.js
      # Install sources before rebuilding native modules for Electron.
      #
      # npm records the @lumine-code git forks with ssh URLs, but the runners
      # have no ssh key. Rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # Preparing the many git-hosted `@lumine-code` forks can be flaky on
      # Windows (intermittent network or pack failures while cloning a git
      # dependency). Retry a couple of times to absorb it.
      - name: Install dependencies
        shell: bash
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      # Validate the removal walker and child preloads on every OS before any
      # Electron session can create and clean package/profile junctions.
      - name: Test filesystem removal and Node child arguments
        run: node --test script/electron-rm-sync-compatibility.test.js script/buffered-node-process-arguments.test.js
      - name: Download the Electron binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/install-electron.js
      - name: Rebuild native modules for Electron
        run: npm run build -- --types prod,optional
      - name: Install core integration spec packages
        shell: bash
        run: node script/install-spec-packages.js --package . --home "${{ runner.temp }}/lumine-core-specs" --github-env "$GITHUB_ENV"
      - name: Test native window lifecycle services
        shell: bash
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          $prefix node --test spec/main-process/auxiliary-window-broker.test.js spec/main-process/file-watch-service.test.js spec/main-process/window-state-persistence.test.js spec/main-process/task-progress.test.js
      - name: Test JavaScript document core
        run: npm run test:document-core
      - name: Test Tree-sitter runtime
        run: npm run test:tree-sitter-runtime
      - name: Test embedded syntax input with the worker backend
        shell: bash
        timeout-minutes: 5
        env:
          LUMINE_SYNTAX_EXECUTION: worker
          LUMINE_EMBEDDED_INPUT_BENCH_CONFIG: '{"sizes":[2],"samples":1,"warmups":0}'
          LUMINE_EMBEDDED_INPUT_BENCH_OUTPUT: ${{ runner.temp }}/embedded-input-smoke.json
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          $prefix npm run test:only -- benchmark/embedded-input-benchmark-spec.js
      - name: Test command-line launchers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:launchers
      # The full CI suite uses a visible, focused window so focus-dependent
      # specs retain their coverage. Exercise the local-only Windows offscreen
      # path once with CI cleared, including its animation-frame guard.
      - name: Test offscreen spec window
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 5
        run: env CI= npm run test:only -- spec/spec-window-rendering-spec.js
      - name: Test trusted scrollbar wheel input
        shell: bash
        timeout-minutes: 5
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          $prefix node script/test-overlay-scrollbar-wheel.js
      # The main-process (Electron main) suite runs under Jasmine in a single
      # session. Like the editor specs it runs once with a
      # timeout guard; a failure here is a real regression, not a retry target.
      - name: Run main-process specs
        shell: bash
        timeout-minutes: 15
        run: |
          if command -v timeout >/dev/null 2>&1; then guard="timeout 600"
          elif command -v gtimeout >/dev/null 2>&1; then guard="gtimeout 600"
          else guard=""; fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Native maximize/fullscreen coverage needs a genuine window manager
            # on the same display as Electron, including its restarted children.
            $guard xvfb-run --auto-servernum bash -euo pipefail -c '
              openbox --sm-disable &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true; wait $wm_pid 2>/dev/null || true" EXIT
              deadline=$((SECONDS + 15))
              until xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -Eq "window id # 0x[1-9a-fA-F][0-9a-fA-F]*"; do
                if ! kill -0 "$wm_pid" 2>/dev/null; then
                  echo "::error::Openbox exited before becoming ready"
                  exit 1
                fi
                if (( SECONDS >= deadline )); then
                  echo "::error::Openbox did not publish its window-manager readiness property"
                  exit 1
                fi
                sleep 0.1
              done
              npm run test:main
            '
          else
            $guard npm run test:main
          fi
      # A single full-suite Electron session, capped so a wedged session cannot
      # hang the job. No retries and no per-file fallback: a failure here is a
      # real regression or a flaky spec, and flaky specs get fixed rather than
      # absorbed into a 30-minute isolation pass.
      - name: Run editor specs
        shell: bash
        timeout-minutes: 60
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          # macOS runners have no GNU `timeout`; Homebrew coreutils ships it as
          # `gtimeout`. Without either, the step timeout is the backstop.
          if command -v timeout >/dev/null 2>&1; then guard="timeout 2700"
          elif command -v gtimeout >/dev/null 2>&1; then guard="gtimeout 2700"
          else guard=""; fi
          $guard $prefix npm run test:editor
      # Run each bundled package in its own Electron session. The combined
      # `npm run test:pkgs` session suffers cross-package state leakage (~200
      # spurious failures) and has hung CI runners; per-package isolation
      # matches how the packages are developed and verified. The `timeout`
      # guard turns any hung package into a fast failure with logs intact.
      - name: Run bundled package specs
        shell: bash
        timeout-minutes: 90
        run: |
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run --auto-servernum"; fi
          # macOS runners have no GNU `timeout`; Homebrew coreutils ships it
          # as `gtimeout`. Without either, the step timeout is the backstop.
          if command -v timeout >/dev/null 2>&1; then
            guard="timeout 600"
          elif command -v gtimeout >/dev/null 2>&1; then
            guard="gtimeout 600"
          else
            guard=""
          fi
          status=0
          failed=""
          # The bundled set is defined by src/bundled-packages.js: every
          # dependency whose own manifest declares an engines.lumine range,
          # resolved wherever the copy lives. Both delivery forms ship with
          # the editor, so both are covered here — otherwise moving a package
          # out of the tree would silently stop running its specs against
          # core changes.
          dirs=$(node -e '
            const fs = require("fs"), path = require("path");
            const { scanBundledPackageNames, resolveBundledPackageDir } = require("./src/bundled-packages");
            const out = [];
            for (const name of scanBundledPackageNames(".")) {
              const dir = resolveBundledPackageDir(".", name);
              if (dir && fs.existsSync(path.join(dir, "spec"))) {
                out.push(path.join(dir, "spec").split(path.sep).join("/"));
              }
            }
            console.log(out.join("\n"));
          ')
          for d in $dirs; do
            pkg="${d#packages/}"
            pkg="${pkg#node_modules/}"
            pkg="${pkg%/spec}"
            package_dir="${d%/spec}"
            echo "::group::$pkg"
            # A bundled package can still have integration specs for packages
            # installed on demand. Honour the same `specPackages` contract as
            # the package's own CI, with a private home for this Electron run.
            spec_packages=$(node -e '
              const fs = require("fs"), path = require("path");
              const manifest = JSON.parse(fs.readFileSync(path.join(process.argv[1], "package.json"), "utf8"));
              process.stdout.write((manifest.specPackages || []).join(" "));
            ' "$package_dir")
            spec_home="$RUNNER_TEMP/lumine-bundled-specs/$pkg"
            if [ -n "$spec_packages" ]; then
              if ! node script/install-spec-packages.js --package "$package_dir" --home "$spec_home"; then
                echo "::error::Spec package installation failed: $pkg"
                failed="$failed $pkg"
                status=1
                echo "::endgroup::"
                continue
              fi
            fi
            # Run once. A failure here is a real regression or a flaky spec;
            # flaky specs get fixed at the source rather than retried away.
            if ! (
              if [ -n "$spec_packages" ]; then
                export LUMINE_HOME="$spec_home"
                export LUMINE_TEST_PACKAGES="$spec_packages"
              else
                unset LUMINE_HOME LUMINE_TEST_PACKAGES
              fi
              $guard $prefix npm start -- --test "$d"
            ); then
              echo "::error::Package specs failed: $pkg"
              failed="$failed $pkg"
              status=1
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Failed packages:$failed"; fi
          exit $status
      # The crash reporter (enabled by default on Windows/Linux, see
      # src/main-process/start.js) writes renderer minidumps to
      # ~/.lumine/crashdumps even when a later attempt turns the job green.
      # Surface them so native crashes can be analyzed offline.
      - name: Stage crash dumps
        if: always()
        shell: bash
        run: |
          dumpdir="$HOME/.lumine/crashdumps"
          if [ -d "$dumpdir" ] && find "$dumpdir" -name '*.dmp' | grep -q .; then
            mkdir -p crashdumps-artifact
            cp -r "$dumpdir"/. crashdumps-artifact/
            echo "Found crash dumps:"
            find crashdumps-artifact -name '*.dmp'
          else
            echo "No crash dumps found."
          fi
      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crashdumps-${{ matrix.os }}
          path: crashdumps-artifact/
          if-no-files-found: ignore
          retention-days: 7
