name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  integration:
    # Run the Jasmine spec suite inside a real Lumine build; the specs exercise
    # the editor runtime (text editors, modal panels, and command dispatch).
    name: Lumine integration specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
    steps:
      - uses: actions/checkout@v6
        with:
          path: {{name}}
      - uses: actions/checkout@v6
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-node@v6
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build and headless-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      # npm records the @lumine-code git forks with ssh URLs, but the runner has
      # no ssh key, so rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: {{name}}
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: xvfb-run --auto-servernum npm start -- --test ../{{name}}/spec
